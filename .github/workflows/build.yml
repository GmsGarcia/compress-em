# Builds every Prism target.
#
# Replaces the 1.17-era workflow, which built a single Fabric-only jar on Java
# 16. Two JDKs are installed: 25 runs the Gradle daemon (Prism's hard
# requirement), and 21 is the compile toolchain for the 1.21.11 targets. The
# 26.1 targets compile on 25.

name: build
on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build all four targets
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      # The two `common` trees are deliberate duplicates rather than a shared
      # source set, so nothing but discipline keeps them in step. README
      # documents exactly three files that may differ; any other difference
      # means one target was edited without the other. This is a plain diff, it
      # needs no JDK, and it fails long before the expensive build.
      - name: verify the two common trees are in step
        run: |
          diff -r \
            --exclude=pack.mcmeta \
            --exclude=compress.accesswidener \
            --exclude=compress.classtweaker \
            versions/1.21.11/common/src/main \
            versions/26.1/common/src/main

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: setup jdk 25 (gradle daemon)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: setup jdk 21 (1.21.11 compile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # setup-java exports JAVA_HOME and the last call wins, so the step above
      # leaves JAVA_HOME on 21. The Gradle daemon needs 25, so point it back
      # explicitly rather than relying on step order. The 1.21.11 targets still
      # compile on 21 through Gradle toolchain resolution, which locates the
      # installed JDK independently of JAVA_HOME.
      - name: point the gradle daemon back at jdk 25
        run: echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Proves the four projects are wired to the right loader plugins and
      # mapping channels. Cheap, and catches a misconfigured target long
      # before the jars are produced.
      - name: prism doctor
        run: ./gradlew prismDoctor --console=plain

      # Deliberately NOT `clean build`. Prism writes the generated access
      # transformers (build/generated/prism/at/*_accesstransformer.cfg) during
      # the configuration phase, and `clean` in the same invocation deletes them
      # before createMinecraftArtifacts reads them, so NFRT exits 1 with
      # NoSuchFileException and all four targets fail. Verified: `clean build`
      # fails, `clean` then `build` as two invocations succeeds. This is a Prism
      # 0.6.0 ordering bug. A fresh runner has no build/ dir anyway, so there is
      # nothing to clean.
      - name: build
        run: ./gradlew build --console=plain

      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            versions/*/*/build/libs/*.jar
          if-no-files-found: error
